# git-cliff — versioning and CHANGELOG.md from conventional commits.
# `pnpm release` drives it; see AGENTS.md § Commits.

[changelog]
header = """
# Changelog

All notable changes to `@open-loop/engine`. Entries are generated from conventional commits by git-cliff; breaking changes carry their migration inline.
"""
# A breaking commit renders its whole BREAKING CHANGE footer — the Migration and
# Why blocks consumers and drift audits read. It is cut from the raw message, not
# taken from `breaking_description`: the footer parser ends that at any line
# opening with `Word:` (`Migration:`, `Why:`), dropping the migration itself.
# Other sections are one line each.
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking %}
### ⚠ Breaking changes
{% for commit in breaking %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% if "BREAKING CHANGE:" in commit.raw_message %}
{{ commit.raw_message | split(pat="BREAKING CHANGE:") | last | split(pat="\nCo-Authored-By:") | first | trim | indent(prefix="  ", first=true, blank=false) }}
{% endif -%}
{% endfor -%}
{% endif -%}
{% for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor -%}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
# Breaking commits always render, whatever their type.
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# Group order is the <!-- n --> prefix; `striptags` drops it at render.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactors" },
  { message = ".*", skip = true },
]

# Pre-1.0 policy: breaking → MINOR, feat/fix/perf/refactor → PATCH.
[bump]
breaking_always_bump_major = false
features_always_bump_minor = false
