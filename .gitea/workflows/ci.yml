name: CI

on:
  push:
    branches: [main, next]
    tags: ['v*']

env:
  HUSKY: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pnpm release` pushes the release commit and its tag together; the tag run
    # is the one that matters, so the branch half of that push is skipped.
    if: "!startsWith(github.ref, 'refs/heads/') || !startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Typechecks a consumer against the built dist under nodenext and bundler
      # resolution, which the source typecheck never exercises.
      - name: Consumer typecheck against dist
        run: pnpm check:nodenext

      # Version-keyed drift audits diff docs/api between tags, so what is
      # committed has to be what a clean build generates. `next` never commits
      # docs/api (the hook skips it in a worktree); the release commit
      # regenerates it after the cut, and the tag run checks it.
      - name: docs/api matches a clean build
        if: github.ref != 'refs/heads/next'
        run: |
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            git status --short -- docs/api
            echo "docs/api is stale: run pnpm build and commit the result."
            exit 1
          fi
